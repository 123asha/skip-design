  <body>
    <div id="root"></div>
    <!-- TEMP diagnostic: if the app fails to mount (e.g. Safari), show the error
         on the page instead of a blank white screen. Remove once resolved. -->
    <script>
      (function () {
        function show(msg) {
          var r = document.getElementById('root');
          if (r && r.children.length === 0) {
            r.innerHTML = '<pre style="margin:0;padding:20px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:#b00020">⚠️ Ошибка загрузки:\n\n' + msg + '</pre>';
          }
        }
        window.addEventListener('error', function (e) {
          show((e && e.message ? e.message : String(e)) + (e && e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('Promise rejection: ' + (e && e.reason ? (e.reason.message || e.reason) : 'unknown'));
        });
      })();
    </script>
