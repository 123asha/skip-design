<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smiley Balls</title>
<style>
  @font-face { font-family: "CoFo Sans"; src: url("CoFoSans-Regular450.woff2") format("woff2"); font-weight: 400 500; font-display: block; }
  :root { --bg: #ffffff; --ink: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #ffffff; --ink: #0b0b0b; }
  }
  :root[data-theme="dark"] { --bg: #ffffff; --ink: #0b0b0b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<h1 class="sr">Шары со смайликами</h1>
<canvas id="c" aria-label="Шары со смайликами: их можно хватать и бросать, клик по пустому месту добавляет шар"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const FONT = '"CoFo Sans", -apple-system, "Helvetica Neue", Arial, sans-serif';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1, R = 60, floorY = 0;

  // emoticons built from type, and a small word under each one (like the weekday under a date)
  // turn: how the glyphs are rotated so the face reads upright (sideways emoticons need a quarter turn)
  const FACES = [
    [':)', 'рад', 1], [':D', 'ха-ха', 1], [';)', 'подм', 1], [':P', 'бе-бе', 1], [':O', 'ого', 1],
    ['=)', 'ок', 1], [':3', 'мур', 1], [':/', 'хм', 1], ['xD', 'лол', 1], ['^^', 'мило', 0],
    [':*', 'чмок', 1], ['B)', 'круто', 1], [':(', 'грусть', 1], ['<3', 'люблю', 0], [':]', 'хе', 1],
    ['8)', 'вау', 1], [':S', 'упс', 1], ['^_^', 'ня', 0], ['T_T', 'плак', 0], ['o_O', 'чё', 0],
  ];

  const balls = [];
  let next = 0;
  function makeBall(x, y) {
    const f = FACES[next++ % FACES.length];
    const r = R * (0.92 + Math.random() * 0.16);
    return {
      x, y, px: x - (Math.random() - 0.5) * 4, py: y - Math.random() * 2, r,
      a: (Math.random() - 0.5) * 1.6, face: f[0], word: f[1], turn: f[2],
      ox: (Math.random() - 0.5) * 0.5, oy: (Math.random() - 0.5) * 0.4,   // text sits off-centre, like the dates
      sw: Math.random() * Math.PI * 2, sp: 0.55 + Math.random() * 0.5,         // sway phase and speed
    };
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    R = Math.max(34, Math.min(92, Math.min(W, H) * 0.085, W / 8.5));
    floorY = H - Math.max(36, H * 0.07);
  }

  // ---------- physics: verlet circles with position-based collisions ----------
  const G = 1500;                                 // px/s²
  let grab = null;
  function step(dt) {
    for (const b of balls) {
      if (b === grab?.ball) continue;
      const vx = (b.x - b.px) * 0.995, vy = (b.y - b.py) * 0.995;
      b.px = b.x; b.py = b.y;
      b.x += vx; b.y += vy + G * dt * dt;
    }
    for (let it = 0; it < 6; it++) {
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j], dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r, d2 = dx * dx + dy * dy;
          if (d2 >= min * min || d2 === 0) continue;
          const d = Math.sqrt(d2), push = (min - d) / d * 0.5;
          const fa = a === grab?.ball ? 0 : b === grab?.ball ? 2 : 1, fb = b === grab?.ball ? 0 : a === grab?.ball ? 2 : 1;
          a.x -= dx * push * fa; a.y -= dy * push * fa;
          b.x += dx * push * fb; b.y += dy * push * fb;
        }
      }
      for (const b of balls) {                    // walls and floor (the top is open so balls can fall in)
        if (b.y + b.r > floorY) { b.y = floorY - b.r; b.px += (b.x - b.px) * 0.08; }   // floor friction
        if (b.x - b.r < 0) b.x = b.r;
        if (b.x + b.r > W) b.x = W - b.r;
      }
    }
    for (const b of balls) b.a += (b.x - b.px) / b.r;   // rolling: the type turns with the ball
  }

  // ---------- drawing ----------
  function bar(x, y, w, h, text, align) {
    ctx.fillStyle = '#0b0b0b'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff'; ctx.font = `${h * 0.78}px ${FONT}`; ctx.textBaseline = 'middle';
    ctx.textAlign = align; ctx.fillText(text, align === 'right' ? x + w - h * 0.25 : x + h * 0.25, y + h * 0.54);
  }
  function backdrop() {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    const bh = Math.max(16, R * 0.32);
    const now = new Date(), month = now.toLocaleString('ru-RU', { month: 'long' });
    bar(0, H * 0.17, W * 0.46, bh, 'Настроение', 'right');
    bar(W * 0.56, H * 0.48, W * 0.44, bh, `${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()}`, 'left');
    // big constructed word behind the pile
    ctx.save();
    const fs = Math.min(W * 0.26, H * 0.36);
    ctx.font = `${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'miter'; ctx.lineWidth = Math.max(6, fs * 0.07); ctx.strokeStyle = '#0b0b0b';
    ctx.strokeText(month.slice(0, 1).toUpperCase() + month.slice(1), W / 2, floorY - fs * 0.02);
    ctx.restore();
  }
  const SWAY = 20 * Math.PI / 180;                 // each ball rocks ±20°
  let clock = 0;
  function drawBall(b) {
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = Math.max(1.2, b.r * 0.02); ctx.strokeStyle = '#0b0b0b'; ctx.stroke();
    ctx.rotate(b.a + (reduce ? 0 : SWAY * Math.sin(clock * b.sp * Math.PI * 2 * 0.5 + b.sw)));
    ctx.translate(b.ox * b.r, b.oy * b.r);
    ctx.fillStyle = '#0b0b0b'; ctx.textAlign = 'center';
    // the emoticon: sideways ones get a quarter turn so they read as a face
    ctx.save();
    if (b.turn) ctx.rotate(Math.PI / 2);
    const fs = b.r * (b.face.length > 2 ? 0.46 : 0.62);
    ctx.font = `${fs}px ${FONT}`; ctx.textBaseline = 'middle';
    ctx.fillText(b.face, 0, b.turn ? 0 : -b.r * 0.06);
    ctx.restore();
    ctx.font = `${b.r * 0.24}px ${FONT}`; ctx.textBaseline = 'top';
    ctx.fillText(b.word, 0, b.r * 0.34);
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    backdrop();
    for (const b of balls) drawBall(b);
    ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0, floorY, W, H - floorY);   // the black floor
  }

  // ---------- spawning & interaction ----------
  const MAX = 60;
  function spawn(x, y) {
    balls.push(makeBall(x, y));
    if (balls.length > MAX) balls.shift();
  }
  function seed(count) {
    for (let i = 0; i < count; i++) {
      const b = makeBall(R + Math.random() * (W - 2 * R), -R - i * R * 0.9 - Math.random() * R);
      balls.push(b);
    }
  }
  function hit(x, y) {
    for (let i = balls.length - 1; i >= 0; i--) { const b = balls[i]; if ((b.x - x) ** 2 + (b.y - y) ** 2 < b.r * b.r) return b; }
    return null;
  }
  canvas.addEventListener('pointerdown', e => {
    const b = hit(e.clientX, e.clientY);
    if (b) {
      grab = { ball: b, dx: b.x - e.clientX, dy: b.y - e.clientY };
      balls.splice(balls.indexOf(b), 1); balls.push(b);     // bring it to the front
      canvas.setPointerCapture(e.pointerId); canvas.classList.add('grabbing');
    } else spawn(e.clientX, Math.min(e.clientY, floorY - R));
  });
  canvas.addEventListener('pointermove', e => {
    if (!grab) return;
    const b = grab.ball;
    b.px = b.x; b.py = b.y;                                   // keep the last move as velocity, so it can be thrown
    b.x = e.clientX + grab.dx; b.y = Math.min(e.clientY + grab.dy, floorY - b.r);
  });
  const release = () => { grab = null; canvas.classList.remove('grabbing'); };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  addEventListener('resize', resize);

  // ---------- go ----------
  let last = 0;
  function frame(t) {
    const dt = Math.min(1 / 30, (t - last) / 1000 || 1 / 60); last = t; clock += dt;
    const sub = 2;
    for (let i = 0; i < sub; i++) step(dt / sub);
    draw();
    requestAnimationFrame(frame);
  }
  (document.fonts ? document.fonts.load(`20px ${FONT}`) : Promise.resolve()).then(() => {
    resize();
    seed(30);
    if (reduce) for (let i = 0; i < 900; i++) step(1 / 120);   // reduced motion: start already settled, no falling
    requestAnimationFrame(frame);
    window.ready = true;
  });
})();
</script>
</body>
</html>
